<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Racha dos clandestinos</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e3a8a">

    <!-- Aparência no Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        input {
            outline: none;
        }

        table {
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px 5px;
        }
    </style>
</head>

<body class="bg-blue-900 text-white min-h-screen">

    <main class="w-full max-w-xl mx-auto px-4 py-6">

        <!-- TÍTULO -->
        <header class="mb-6">
            <h1
                class="text-3xl sm:text-4xl font-bold text-center
                       bg-blue-800 px-5 py-4 rounded-2xl shadow-lg"
            >
                ⚽ Sistema de Estatísticas
            </h1>
        </header>


        <!-- ADICIONAR JOGADOR -->
        <section
            class="bg-blue-800 p-6 rounded-2xl shadow-lg w-full mb-6"
        >

            <h2 class="text-xl font-semibold mb-4">
                Adicionar Jogador
            </h2>

            <input
                id="nome"
                type="text"
                placeholder="Nome do jogador"
                autocomplete="off"
                class="w-full p-3 mb-3 rounded-lg text-black"
            >

            <button
                onclick="adicionarJogador()"
                class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700
                       w-full py-3 rounded-lg font-medium transition"
            >
                Adicionar
            </button>

        </section>


        <!-- LISTA -->
        <section class="w-full">

            <div
                class="flex flex-col sm:flex-row
                       justify-between sm:items-center
                       gap-3 mb-4"
            >

                <h2 class="text-xl font-semibold">
                    Lista de Jogadores
                </h2>

                <input
                    id="pesquisa"
                    oninput="render()"
                    type="text"
                    placeholder="Pesquisar..."
                    autocomplete="off"
                    class="p-3 rounded-lg text-black w-full sm:w-44"
                >

            </div>

            <div id="lista" class="space-y-4"></div>

        </section>


        <!-- RANKING -->
        <section class="mt-10 w-full">

            <h2 class="text-xl font-semibold mb-4">
                🏆 Ranking
            </h2>

            <button
                onclick="gerarRanking()"
                class="bg-yellow-500 hover:bg-yellow-600
                       active:bg-yellow-700
                       text-white font-medium
                       w-full py-3 rounded-lg
                       mb-4 transition"
            >
                Gerar Ranking
            </button>

            <div id="ranking"></div>

        </section>


        <!-- INSTALAÇÃO -->
        <section
            id="instalacao"
            class="hidden mt-8 bg-blue-800
                   p-4 rounded-2xl shadow-lg text-center"
        >

            <p class="mb-3">
                📱 Instale o Racha dos clandestinos no seu celular.
            </p>

            <button
                id="botaoInstalar"
                class="bg-green-500 hover:bg-green-600
                       px-5 py-3 rounded-lg font-semibold"
            >
                Instalar aplicativo
            </button>

        </section>

    </main>


    <script>
        /* =========================================================
           DADOS
        ========================================================= */

        let jogadores = [];

        try {
            jogadores =
                JSON.parse(localStorage.getItem("jogadores")) || [];
        } catch (erro) {
            console.error("Erro ao carregar jogadores:", erro);
            jogadores = [];
        }


        /* =========================================================
           SALVAR
        ========================================================= */

        function salvarDados() {
            localStorage.setItem(
                "jogadores",
                JSON.stringify(jogadores)
            );
        }


        /* =========================================================
           ADICIONAR JOGADOR
        ========================================================= */

        function adicionarJogador() {

            const nomeInput =
                document.getElementById("nome");

            const nome =
                nomeInput.value.trim();

            if (!nome) {
                alert("Digite um nome válido!");
                nomeInput.focus();
                return;
            }

            const jogadorExistente =
                jogadores.some(
                    jogador =>
                        jogador.nome.toLowerCase() ===
                        nome.toLowerCase()
                );

            if (jogadorExistente) {
                alert("Esse jogador já está cadastrado!");
                nomeInput.focus();
                return;
            }

            jogadores.push({
                nome: nome,
                gols: 0,
                assistencias: 0
            });

            salvarDados();

            nomeInput.value = "";

            render();

            nomeInput.focus();
        }


        /* =========================================================
           ENTER PARA ADICIONAR
        ========================================================= */

        document
            .getElementById("nome")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    adicionarJogador();
                }

            });


        /* =========================================================
           ATUALIZAR GOLS / ASSISTÊNCIAS
        ========================================================= */

        function atualizar(index, tipo, valor) {

            if (!jogadores[index]) {
                return;
            }

            jogadores[index][tipo] += valor;

            if (jogadores[index][tipo] < 0) {
                jogadores[index][tipo] = 0;
            }

            salvarDados();

            render();
        }


        /* =========================================================
           EXCLUIR
        ========================================================= */

        function excluirJogador(index) {

            if (!jogadores[index]) {
                return;
            }

            const confirmar = confirm(
                `Deseja excluir ${jogadores[index].nome}?`
            );

            if (!confirmar) {
                return;
            }

            jogadores.splice(index, 1);

            salvarDados();

            render();

            document.getElementById("ranking").innerHTML = "";
        }


        /* =========================================================
           EDITAR NOME
        ========================================================= */

        function editarNome(index) {

            if (!jogadores[index]) {
                return;
            }

            const novoNome = prompt(
                "Digite o novo nome do jogador:",
                jogadores[index].nome
            );

            if (!novoNome) {
                return;
            }

            const nomeLimpo = novoNome.trim();

            if (!nomeLimpo) {
                return;
            }

            const duplicado = jogadores.some(
                (jogador, i) =>
                    i !== index &&
                    jogador.nome.toLowerCase() ===
                    nomeLimpo.toLowerCase()
            );

            if (duplicado) {
                alert("Já existe um jogador com esse nome.");
                return;
            }

            jogadores[index].nome = nomeLimpo;

            salvarDados();

            render();
        }


        /* =========================================================
           RENDERIZAR LISTA
        ========================================================= */

        function render() {

            const lista =
                document.getElementById("lista");

            const pesquisa =
                document.getElementById("pesquisa");

            const busca =
                pesquisa.value.toLowerCase().trim();

            lista.innerHTML = "";


            const filtrados = jogadores
                .map((jogador, index) => ({
                    jogador,
                    index
                }))
                .filter(item =>
                    item.jogador.nome
                        .toLowerCase()
                        .includes(busca)
                )
                .sort((a, b) =>
                    a.jogador.nome.localeCompare(
                        b.jogador.nome,
                        "pt-BR"
                    )
                );


            if (filtrados.length === 0) {

                lista.innerHTML = `
                    <div class="bg-blue-800 p-5 rounded-xl text-center">
                        <p class="text-blue-100">
                            ${
                                jogadores.length === 0
                                ? "Nenhum jogador cadastrado."
                                : "Nenhum jogador encontrado."
                            }
                        </p>
                    </div>
                `;

                return;
            }


            filtrados.forEach(item => {

                const jogador = item.jogador;
                const index = item.index;

                lista.innerHTML += `

                    <article
                        class="bg-blue-700 p-4 rounded-xl shadow"
                    >

                        <div
                            class="flex flex-col sm:flex-row
                                   justify-between
                                   gap-3"
                        >

                            <div>

                                <h3 class="text-lg font-bold">
                                    ${escaparHTML(jogador.nome)}
                                </h3>

                                <p class="mt-2">
                                    Gols: ${jogador.gols}
                                </p>

                                <p>
                                    Assistências:
                                    ${jogador.assistencias}
                                </p>

                            </div>


                            <div class="flex gap-2">

                                <button
                                    onclick="editarNome(${index})"
                                    class="bg-yellow-500
                                           hover:bg-yellow-600
                                           px-3 py-2
                                           rounded-lg
                                           text-sm font-medium"
                                >
                                    Editar
                                </button>

                                <button
                                    onclick="excluirJogador(${index})"
                                    class="bg-red-600
                                           hover:bg-red-700
                                           px-3 py-2
                                           rounded-lg
                                           text-sm font-medium"
                                >
                                    Excluir
                                </button>

                            </div>

                        </div>


                        <div
                            class="flex gap-2 mt-4
                                   flex-wrap"
                        >

                            <button
                                onclick="atualizar(
                                    ${index},
                                    'gols',
                                    1
                                )"
                                class="bg-green-500
                                       hover:bg-green-600
                                       px-3 py-2
                                       rounded-lg"
                            >
                                + Gol
                            </button>


                            <button
                                onclick="atualizar(
                                    ${index},
                                    'gols',
                                    -1
                                )"
                                class="bg-red-500
                                       hover:bg-red-600
                                       px-3 py-2
                                       rounded-lg"
                            >
                                - Gol
                            </button>


                            <button
                                onclick="atualizar(
                                    ${index},
                                    'assistencias',
                                    1
                                )"
                                class="bg-green-500
                                       hover:bg-green-600
                                       px-3 py-2
                                       rounded-lg"
                            >
                                + Assist
                            </button>


                            <button
                                onclick="atualizar(
                                    ${index},
                                    'assistencias',
                                    -1
                                )"
                                class="bg-red-500
                                       hover:bg-red-600
                                       px-3 py-2
                                       rounded-lg"
                            >
                                - Assist
                            </button>

                        </div>

                    </article>
                `;
            });
        }


        /* =========================================================
           RANKING
        ========================================================= */

        function gerarRanking() {

            const rankingDiv =
                document.getElementById("ranking");


            if (jogadores.length === 0) {

                rankingDiv.innerHTML = `
                    <div class="bg-blue-800 p-4 rounded-xl">
                        Nenhum jogador cadastrado.
                    </div>
                `;

                return;
            }


            const porGols = [...jogadores].sort(
                (a, b) =>
                    b.gols - a.gols ||
                    a.nome.localeCompare(b.nome, "pt-BR")
            );


            const porAssist = [...jogadores].sort(
                (a, b) =>
                    b.assistencias - a.assistencias ||
                    a.nome.localeCompare(b.nome, "pt-BR")
            );


            let tabela = `

                <div class="bg-blue-800 p-4 rounded-xl mb-4">

                    <h3 class="font-bold mb-3">
                        ⚽ Ranking de Gols
                    </h3>

                    <div class="overflow-x-auto">

                        <table class="w-full text-left">

                            <thead>
                                <tr class="border-b border-blue-600">
                                    <th>#</th>
                                    <th>Nome</th>
                                    <th>Gols</th>
                                </tr>
                            </thead>

                            <tbody>
            `;


            porGols.forEach((jogador, i) => {

                tabela += `

                    <tr class="border-b border-blue-700">

                        <td>${i + 1}</td>

                        <td>
                            ${escaparHTML(jogador.nome)}
                        </td>

                        <td>
                            ${jogador.gols}
                        </td>

                    </tr>
                `;
            });


            tabela += `

                            </tbody>

                        </table>

                    </div>

                </div>
            `;


            tabela += `

                <div class="bg-blue-800 p-4 rounded-xl">

                    <h3 class="font-bold mb-3">
                        🎯 Ranking de Assistências
                    </h3>

                    <div class="overflow-x-auto">

                        <table class="w-full text-left">

                            <thead>
                                <tr class="border-b border-blue-600">
                                    <th>#</th>
                                    <th>Nome</th>
                                    <th>Assist.</th>
                                </tr>
                            </thead>

                            <tbody>
            `;


            porAssist.forEach((jogador, i) => {

                tabela += `

                    <tr class="border-b border-blue-700">

                        <td>${i + 1}</td>

                        <td>
                            ${escaparHTML(jogador.nome)}
                        </td>

                        <td>
                            ${jogador.assistencias}
                        </td>

                    </tr>
                `;
            });


            tabela += `

                            </tbody>

                        </table>

                    </div>

                </div>
            `;


            rankingDiv.innerHTML = tabela;
        }


        /* =========================================================
           SEGURANÇA DO TEXTO
        ========================================================= */

        function escaparHTML(texto) {

            const div =
                document.createElement("div");

            div.textContent = texto;

            return div.innerHTML;
        }


        /* =========================================================
           SERVICE WORKER - PWA
        ========================================================= */

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function() {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(function(registro) {

                        console.log(
                            "Service Worker registrado:",
                            registro.scope
                        );

                    })
                    .catch(function(erro) {

                        console.error(
                            "Erro ao registrar Service Worker:",
                            erro
                        );

                    });

            });

        }


        /* =========================================================
           INSTALAÇÃO DO APLICATIVO
        ========================================================= */

        let eventoInstalacao = null;

        const instalacao =
            document.getElementById("instalacao");

        const botaoInstalar =
            document.getElementById("botaoInstalar");


        window.addEventListener(
            "beforeinstallprompt",
            function(event) {

                event.preventDefault();

                eventoInstalacao = event;

                instalacao.classList.remove("hidden");

            }
        );


        botaoInstalar.addEventListener(
            "click",
            async function() {

                if (!eventoInstalacao) {
                    return;
                }

                eventoInstalacao.prompt();

                const resultado =
                    await eventoInstalacao.userChoice;

                console.log(
                    "Resultado da instalação:",
                    resultado.outcome
                );

                eventoInstalacao = null;

                instalacao.classList.add("hidden");
            }
        );


        window.addEventListener(
            "appinstalled",
            function() {

                console.log(
                    "Aplicativo instalado com sucesso."
                );

                instalacao.classList.add("hidden");

            }
        );


        /* =========================================================
           INICIAR
        ========================================================= */

        render();

    </script>

</body>
</html>
